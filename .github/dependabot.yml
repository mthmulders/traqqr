version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    ignore:
      # These needs to align with the version of OpenLiberty
      - dependency-name: "com.ibm.websphere.appserver.api:com.ibm.websphere.appserver.api.basics"
      - dependency-name: "com.ibm.websphere.appserver.api:com.ibm.websphere.appserver.api.security"
      - dependency-name: "jakarta.platform:jakarta.jakartaee-bom"
      - dependency-name: "org.eclipse.persistence:org.eclipse.persistence.jpa"
      - dependency-name: "org.jboss.resteasy:resteasy-core"
      - dependency-name: "org.jboss.weld.se:weld-se-core"
      - dependency-name: "org.eclipse:yasson"
      # During the rewrite to Jakarta MVC, these dependencies can stay as they are. No need to update them.
      - dependency-name: "org.primefaces:primefaces"
      - dependency-name: "org.primefaces:primefaces-themes"
    groups:
      development-dependencies:
        dependency-type: "development"
      production-dependencies-patches:
        dependency-type: "production"
        update-types: [ "patch" ]
  - package-ecosystem: docker
    directory: /runtime
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      time: "04:00"
    open-pull-requests-limit: 10
